<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Children in Orange Dresses</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Children Characters in Orange Dresses</h1>
        
        <div class="children-container" id="childrenContainer">
            <!-- Children characters will be dynamically added here -->
        </div>
        
        <div class="controls">
            <button onclick="addChild()">Add Child</button>
            <button onclick="removeChild()">Remove Child</button>
            <button onclick="animateChildren()">Animate Dresses</button>
        </div>
        
        <div class="info">
            <h3>Feature Details:</h3>
            <ul>
                <li>All children wear orange dresses</li>
                <li>Orange color: #FF8C00 (Dark Orange)</li>
                <li>Each child has unique characteristics</li>
                <li>Interactive controls to add/remove children</li>
            </ul>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
